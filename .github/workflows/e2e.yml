name: e2e

# Maestro flows on an Android emulator against a mock-mode debug build. Manual and nightly: the
# native build takes long, so it stays off the per-push path.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_MOCK: "1"
      APP_VARIANT: development
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: bun install --frozen-lockfile
      - name: prebuild and assemble
        run: |
          bunx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: install maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            maestro test maestro/flows --format junit --output maestro-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-report
          path: maestro-report.xml
